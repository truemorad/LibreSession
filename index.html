<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline'"
    />
    <title>LibreSession</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --pm: rgb(255, 255, 255);
        --hence: color-mix(in srgb, var(--pm), var(--bgColor) 30%);
        --bgColor: rgb(41, 41, 41);
        --bg-tt: color-mix(in srgb, var(--bgColor), rgba(40, 40, 40, 0.4) 80%);
        --accColor: rgb(219, 14, 185);
        --acc-btn: color-mix(in srgb, var(--accColor), var(--pm) 20%);
        --acc-mixed: color-mix(in srgb, var(--accColor), var(--pm) 10%);
        --btn: color-mix(in srgb, rgba(0, 0, 0, 0), var(--pm) 10%);
        --btn-hvr: color-mix(in srgb, rgba(0, 0, 0, 0), var(--pm) 20%);
        --outline: 0px 1px 1px 1px var(--btn);
        --rad: 20px;
        --per-mg: calc(var(--margin) / 2);
        --margin: 10px;
        --ui-height: 40px;
        --in-title: calc(var(--ui-height) - var(--margin));
        --easeIn: ease-in 0.2s;
        --easeOut: ease-out 0.2s;
      }
      /* SITE */
      html,
      body {
        background: var(--bgColor);
        overflow: hidden;
      }
      .main {
        padding-top: 10px;
        height: 100vh;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      .btn-base,
      .btn-base:focus {
        user-select: none;
        app-region: no-drag;
        -webkit-app-region: no-drag;
        color: var(--pm);
        background: var(--btn);
      }
      .btn-base:hover,
      .btn-base:focus-visible {
        background-color: var(--btn-hvr);
        color: var(--hence);
      }
      .btn-base.btn-base:active {
        background-color: var(--bg-tt);
        color: var(--acc-mixed);
      }
      code {
        color: var(--acc-btn);
        background-color: var(--bg-tt);
      }
      a {
        color: var(--accColor) !important;
      }
      /* fixes */
      .plz {
        top: -90vh;
        width: fit-content;
        margin: 0 auto;
        animation: show-down 0.5s;
        user-select: none;
      }
      .no-margin {
        margin: 0px !important;
      }
      .hidden {
        opacity: 0;
        width: 0px;
        height: 0px;
        border: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--acc-btn);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--acc-mixed);
      }
      ::-webkit-scrollbar-track {
        background-color: var(--btn);
      }
      ::selection {
        color: var(--pm);
        background: var(--acc-btn);
      }
      @keyframes pop-out {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <style>
      h1,
      h2 {
        color: var(--pm);
      }
      .filePath {
        position: fixed;
        display: flex;
        width: 80%;
        color: var(--acc-btn);
        top: var(--per-mg);
        left: calc(var(--per-mg) + 2rem);
        scrollbar-width: none;
        user-select: none;
      }
      .fileInfo {
        font-size: 120%;
        text-decoration: none;
        color: var(--pm);
        cursor: pointer;
      }
      .btn-primary {
        color: var(--pm) !important;
        background-color: var(--btn-hvr);
        border-color: var(--btn-hvr);
        width: 8rem;
      }
      .btn-primary:hover {
        background-color: var(--btn);
        border-color: var(--btn-hvr);
      }
      .btn-primary:active,
      .btn-primary:focus-visible {
        background-color: var(--bg-tt) !important;
        border-color: var(--acc-btn) !important;
      }
      /* toolbar */
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        position: fixed;
        width: 100%;
        bottom: 1rem;
      }
      .btnBar {
        width: fit-content;
        height: fit-content;
        background: var(--bg-tt);
        backdrop-filter: blur(20px);
        box-shadow: var(--outline);
        border-radius: var(--rad);
        user-select: none;
      }
      #vaultIMG {
        margin-left: var(--per-mg);
      }
      #vaultIMG:hover {
        transform: none;
        animation: roll 0.5s;
      }
      @keyframes roll {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(45deg);
        }
      }
      #divider {
        color: var(--acc-btn);
        display: inline-block;
      }
      .btnBar button {
        background: none;
        border: none;
        margin-top: var(--per-mg);
        margin-bottom: var(--per-mg);
        size: 100px;
        fill: var(--acc-btn);
        padding-inline: 3px;
        transition: var(--easeOut);
      }
      .btnBar button:hover {
        fill: var(--acc-mixed);
        transform: translateY(-5px);
        transition: var(--easeIn);
      }
      .options {
        margin-right: var(--per-mg);
      }
      /* options page */
      .optionsPage {
        position: fixed;
        overflow-y: scroll;
        overflow-x: hidden;
        scroll-behavior: smooth;
        animation: pop-right 0.5s;
        width: 10rem;
        height: 100%;
        right: 0rem;
        bottom: 0rem;
        padding: var(--margin);
        background: var(--bg-tt);
        backdrop-filter: blur(20px);
        border-left: solid 1px var(--btn);
        transition: var(--easeOut);
      }
      @keyframes pop-right {
        from {
          right: -10rem;
        }
        to {
          right: 0rem;
        }
      }
      #optionsClose {
        position: fixed;
        user-select: none;
        top: var(--per-mg);
        right: var(--per-mg);
        background: none;
        border: none;
        cursor: pointer;
        fill: var(--acc-btn);
        animation: pop-out 0.5s;
      }
      #preview {
        color: var(--pm);
        word-wrap: break-word;
      }
      #markdown-input {
        height: 90vh;
        background: var(--btn);
        color: var(--pm);
        border: none;
        overflow-y: scroll;
        padding: 5px;
        border-radius: 5px;
        resize: none;
        white-space: pre-wrap;
        display: inline-block;
        width: 100%;
      }
      #markdown-input::placeholder {
        color: var(--hence);
      }
      #markdown-input:focus-visible {
        outline-color: var(--acc-btn);
        outline-style: double;
      }
      #inlineCode {
        background: var(--btn);
        color: var(--acc-btn);
        padding: 0.2rem;
        border-radius: 0.2rem;
      }
    </style>
    <script type="module" defer>
      class MarkdownProcessor {
        compile(markdown) {
          // First, split content by line breaks and process lists
          let content = this.preprocessLists(markdown);

          // Then convert the processed content
          return this.parseMarkdown(content);
        }

        preprocessLists(text) {
          const lines = text.split("\n");
          console.log(lines);
          let inOrderedList = false;
          let inUnorderedList = false;
          let processedLines = [];

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const isOrderedListItem = /^\d+\.\s/.test(line);
            const isUnorderedListItem = /^-\s/.test(line);

            // Handle ordered lists
            if (isOrderedListItem) {
              if (!inOrderedList) {
                processedLines.push("<ol>");
                inOrderedList = true;
              }
              processedLines.push(line);
            }
            // Handle unordered lists
            else if (isUnorderedListItem) {
              if (!inUnorderedList) {
                processedLines.push("<ul>");
                inUnorderedList = true;
              }
              processedLines.push(line);
            }
            // Close lists if we're no longer in a list
            else {
              if (inOrderedList) {
                processedLines.push("</ol>");
                inOrderedList = false;
              }
              if (inUnorderedList) {
                processedLines.push("</ul>");
                inUnorderedList = false;
              }
              processedLines.push(line);
            }
          }

          // Close any remaining open lists
          if (inOrderedList) processedLines.push("</ol>");
          if (inUnorderedList) processedLines.push("</ul>");

          return processedLines.join("\n");
        }

        parseMarkdown(text) {
          // Process code blocks first
          text = this.processCodeBlocks(text);

          // Then process the rest of the markdown
          return text
            .replace(/(?:^|\n)([^\n]+)/g, (match, line) => {
              // Skip processing if it's already an HTML tag
              if (line.trim().startsWith("<") && line.trim().endsWith(">")) {
                return "\n" + line;
              }

              // Process other markdown elements
              let processed = line;

              // Headings
              if (/^#{1,6}\s/.test(processed)) {
                const level = processed.match(/^(#{1,6})/)[0].length;
                processed = `<h${level}>${processed.replace(
                  /^#{1,6}\s/,
                  ""
                )}</h${level}>`;
              }
              // Bold (process before italic since it uses more asterisks)
              else if (/\*\*.*\*\*/.test(processed)) {
                processed = processed.replace(
                  /\*\*(.*?)\*\*/g,
                  "<strong>$1</strong>"
                );
              }
              // Italic
              else if (/\*.*\*/.test(processed)) {
                processed = processed.replace(/\*(.*?)\*/g, "<em>$1</em>");
              }
              // Images (process before links since they're more specific)
              else if (/!\[.*\]\(.*\)/.test(processed)) {
                processed = processed.replace(
                  /!\[([^\]]+)\]\(([^\)]+)\)/g,
                  '<img src="$2" alt="$1">'
                );
              }
              // Links
              else if (/\[.*\]\(.*\)/.test(processed)) {
                processed = processed.replace(
                  /\[([^\]]+)\]\(([^\)]+)\)/g,
                  '<a href="$2">$1</a>'
                );
              }
              // List items (already wrapped in ul/ol from preprocessLists)
              else if (/^-\s/.test(processed)) {
                processed = processed.replace(/^-\s(.*)/, "<li>$1</li>");
              } else if (/^\d+\.\s/.test(processed)) {
                processed = processed.replace(/^\d+\.\s(.*)/, "<li>$1</li>");
              }
              // Inline code
              else if (/`.*`/.test(processed)) {
                processed = processed.replace(/`(.*?)`/g, "<code>$1</code>");
              }
              // Paragraphs (only if line isn't empty and isn't already processed)
              else if (processed.trim() && !processed.trim().startsWith("<")) {
                processed = `<p>${processed}</p>`;
              }

              return "\n" + processed;
            })
            .trim();
        }

        processCodeBlocks(text) {
          // Handle code blocks with triple backticks
          return text.replace(/```([\s\S]*?)```/g, (match, code) => {
            return `<pre><code>${code.trim()}</code></pre>`;
          });
        }
      }

      export { MarkdownProcessor };
      const optionsBtn = document.getElementsByClassName("options")[0];
      const optionsPage = document.createElement("div");
      optionsPage.innerHTML =
        '<div class="optionsPage"> <div class="col-12" id="main"> <button id="optionsClose"> <svg width="7.5mm" height="7.5mm" viewBox="0 0 7.5 7.5" version="1.1" id="svg1" xml:space="preserve" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" > <path id="path1" d="M 1.3291178,0.88986816 A 3.75,3.75 0 0 0 0.88418376,1.3368693 L 3.3279622,3.8059692 0.93482666,6.224943 A 3.75,3.75 0 0 0 1.3916463,6.656958 L 3.7703125,4.2524536 6.132959,6.6388713 A 3.75,3.75 0 0 0 6.5866781,6.2022054 L 4.2136963,3.8044189 6.6357707,1.3559896 A 3.75,3.75 0 0 0 6.1944539,0.90795492 L 3.7708293,3.3574178 Z" /> </svg> </button> <h2>Colors</h2> <label class="btn btn-primary" for="accentInput" ><input type="color" id="accentInput" class="hidden" />Tertiary</label > <label class="btn btn-primary" for="bgInput" ><input type="color" id="bgInput" class="hidden" />Background</label > </div> </div>';

      // options button
      optionsBtn.addEventListener("click", () => {
        document.body.appendChild(optionsPage);
        document
          .getElementById("optionsClose")
          .addEventListener("click", () => {
            optionsPage.remove();
          });
        // general page
        // colors
        const accColor = document.getElementById("accentInput");
        accColor.addEventListener("input", () => {
          const color = accColor.value;
          colorSwitcher(color, "acc");
        });
        const bgColor = document.getElementById("bgInput");
        bgColor.addEventListener("input", () => {
          const color = bgColor.value;
          colorSwitcher(color, "bg");
        });
      });
      // markdown
      const processor = new MarkdownProcessor();
      const input = document.getElementById("markdown-input");
      const preview = document.getElementById("preview");
      preview.innerHTML = processor.compile(input.innerHTML);
      input.addEventListener("input", () => {
        lettCount();
        // store it
        preview.innerHTML = processor.compile(input.innerHTML);
        const links = document.getElementsByTagName("a");
        externalLinks(links);
      });
      input.addEventListener("keyup", (evt) => {
        arroCount(evt);
      });
      input.addEventListener("click", () => {
        lettCount();
      });
      // color switcher
      const colorSwitcher = async (color, type) => {
        const colorRGB = toRGB(color);
        if (type === "bg") {
          if (isDarkerThan(color, "#5e5e5e5e")) {
            document.documentElement.style.setProperty(
              "--pm",
              `rgb(255, 255, 255)`
            );
          } else {
            document.documentElement.style.setProperty("--pm", `rgb(0, 0, 0)`);
          }
          document.documentElement.style.setProperty(
            "--bgColor",
            `rgb(${colorRGB.r}, ${colorRGB.g}, ${colorRGB.b})`
          );
        }
        if (type === "acc") {
          document.documentElement.style.setProperty(
            "--accColor",
            `rgb(${colorRGB.r}, ${colorRGB.g}, ${colorRGB.b})`
          );
        }
      };
      // Convert hex to RGB thanks claude
      const toRGB = (hex) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
      };
      // handle the primary color based on the luminace of background color
      function isDarkerThan(color, threshold) {
        // Calculate relative luminance
        const getLuminance = (r, g, b) => {
          // Formula: 0.299R + 0.587G + 0.114B thanks stacks overflow
          return 0.299 * r + 0.587 * g + 0.114 * b;
        };
        const rgb1 = toRGB(color);
        const rgb2 = toRGB(threshold);
        const luminance1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
        const luminance2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);

        return luminance1 < luminance2;
      }
      // letter counter
      const lettCount = () => {
        const wordCount = document.getElementById("wordCount");
        const selection = window.getSelection();
        const range = selection.getRangeAt(0);
        const position = range.startOffset;
        return position;
      };
      // arrow location count
      const arroCount = (evt) => {
        let position = lettCount();
        switch (evt.key) {
          case "ArrowRight":
            if (position < evt.target.innerText.length - 1) {
              position++;
            }
            break;

          case "ArrowLeft":
            if (position > 0) {
              position--;
            }
            break;

          case "ArrowUp":
            position = evt.target.innerText.length;
            break;

          case "ArrowDown":
            position = evt.target.innerText.length;
            break;

          default:
            return;
        }
      };
    </script>
